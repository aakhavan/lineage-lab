# Marquez (OpenLineage reference backend) for lineage-lab.
# Based on the Marquez repo's docker-compose.yml + docker-compose.web.yml (main, TAG=0.51.1, checked 2026-11-11),
# trimmed: no OpenSearch (SEARCH_ENABLED=false), the DB is created by the postgres image's own env vars
# instead of the repo's init-db.sh volume, and the DB port is not published (avoids clashing with OpenMetadata's 5432).
# Credentials are the Marquez documented local dev defaults (marquez.dev.yml).
name: lineagelab_marquez

services:
  db:
    image: postgres:14.24
    container_name: lineagelab-marquez-db
    environment:
      POSTGRES_USER: marquez
      POSTGRES_PASSWORD: marquez
      POSTGRES_DB: marquez
    volumes:
      - marquez-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marquez -d marquez"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    image: marquezproject/marquez:0.51.1
    container_name: lineagelab-marquez-api
    environment:
      MARQUEZ_PORT: "5000"
      MARQUEZ_ADMIN_PORT: "5001"
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      SEARCH_ENABLED: "false"
    ports:
      - "5000:5000"
      - "5001:5001"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    image: marquezproject/marquez-web:0.51.1
    container_name: lineagelab-marquez-web
    environment:
      MARQUEZ_HOST: api
      MARQUEZ_PORT: "5000"
      WEB_PORT: "3000"
      REACT_APP_ADVANCED_SEARCH: "false"
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  marquez-db:
