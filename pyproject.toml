[project]
name = "lineagelab"
version = "0.0.1"
description = "lineage-lab: governor's dbt project in OpenMetadata and as OpenLineage events (a learning module)"
requires-python = ">=3.12"
dependencies = [           # keep this light; heavy CLIs (metadata, dbt, dbt-ol) run in the container or in isolated uv tool envs
    "pyyaml",
    "httpx",
    "psycopg[binary]",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lineagelab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
